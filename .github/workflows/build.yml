name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # androidgitversion needs tags/history

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      - name: Build debug APKs and run unit tests
        run: ./gradlew --no-daemon assembleDropboxDebug assembleCloudlessDebug testDropboxDebugUnitTest testCloudlessDebugUnitTest

      - uses: actions/upload-artifact@v5
        with:
          name: debug-apks
          path: app/build/outputs/apk/*/debug/*.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      - name: Decode keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APKs
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_FOLDER_APP_KEY: ${{ secrets.DROPBOX_FOLDER_APP_KEY }}
        run: >
          ./gradlew --no-daemon assembleDropboxRelease assembleCloudlessRelease
          "-Pdropbox.appKey=$DROPBOX_APP_KEY"
          "-Pdropbox.folderAppKey=$DROPBOX_FOLDER_APP_KEY"

      - name: Rename APKs
        run: |
          mkdir dist
          cp app/build/outputs/apk/dropbox/release/app-dropbox-release.apk "dist/simpletask-dropbox-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/apk/cloudless/release/app-cloudless-release.apk "dist/simpletask-cloudless-${GITHUB_REF_NAME}.apk"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.apk --title "$GITHUB_REF_NAME" --generate-notes --repo "$GITHUB_REPOSITORY"
