

plugins {
    id 'com.gladed.androidgitversion' version '0.4.13'
//    id 'com.github.triplet.play' version '3.0.0'
    
}

apply plugin: 'com.android.application'
apply plugin: 'com.android.legacy-kapt'

if (!project.hasProperty("storeP12File")) {
    ext.storeP12File = file("/")
}

if (!project.hasProperty("storeServiceAccount")) {
    ext.storeServiceAccount = ""
}

// Base applicationId for this fork. Flavors append a suffix (cloudless uses the base as-is).
def appIdBase = "ca.delahousse.simpletask"

// Dropbox app keys (without the "db-" prefix), taken from Gradle properties or local.properties:
//   dropbox.appKey       = key of a "Full Dropbox" app
//   dropbox.folderAppKey = key of an "App folder" app
// Not committed. Without them the dropbox flavor builds but cannot log in.
// A hand-made app/src/dropbox/res/values/dropbox.xml (upstream's mechanism) takes precedence.
def localProps = new Properties()
if (rootProject.file("local.properties").exists()) {
    rootProject.file("local.properties").withInputStream { localProps.load(it) }
}
def dropboxKey = { String name ->
    def key = project.findProperty(name) ?: localProps.getProperty(name)
    return "db-" + (key ?: "placeholder")
}


android {
    namespace "nl.mpcjanssen.simpletask"
    compileSdkVersion 37
    flavorDimensions "main"

    buildFeatures {
        viewBinding true
        buildConfig true
        resValues true
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/LICENSE.txt', 'META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/NOTICE.txt', 'LICENSE.txt']
        }
    }


    //noinspection GroovyMissingReturnStatement

    defaultConfig {
        versionName "11.0.1"
        versionCode 11000001
        buildConfigField "String", "GIT_VERSION", "\"" + androidGitVersion.name() + "\""
        multiDexEnabled false
        minSdkVersion 26
        targetSdkVersion 37
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        kapt {
            arguments {
                arg("room.schemaLocation", "$projectDir/schemas".toString())
                arg("room.incremental", "true")
                arg("room.expandProjection", "true")
            }
        }
    }

    productFlavors {
        dropbox {
            dimension "main"
            applicationId = appIdBase + ".dropbox"
            manifestPlaceholders = [providerFlavour: "dropbox"]
            if (!file("src/dropbox/res/values/dropbox.xml").exists()) {
                resValue "string", "dropbox_consumer_key", dropboxKey("dropbox.appKey")
            }
            if (!file("src/dropbox/res/values/dropbox-folder.xml").exists()) {
                resValue "string", "dropbox_folder_consumer_key", dropboxKey("dropbox.folderAppKey")
            }
        }
        cloudless {
            dimension "main"
            applicationId = appIdBase
            manifestPlaceholders = [providerFlavour: "cloudless"]
        }
        encrypted {
            dimension "main"
            applicationId = appIdBase + ".encrypted"
            manifestPlaceholders = [providerFlavour: "encrypted"]
        }
        nextcloud {
            dimension "main"
            applicationId = appIdBase + ".nextcloud"
            manifestPlaceholders = [providerFlavour: "nextcloud"]
        }
//        dokuwiki {
//            dimension "main"
//            applicationId = appIdBase + ".dokuwiki"
//            manifestPlaceholders = [providerFlavour: "dokuwiki"]
//        }
        webdav {
            dimension "main"
            applicationId = appIdBase + ".webdav"
            manifestPlaceholders = [providerFlavour: "webdav"]
        }
    }

    signingConfigs {
        release {
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix = ".debug"
            versionNameSuffix = '-DEBUG'
            manifestPlaceholders = [providerBuildType: "debug"]
        }
        release {
            //noinspection GroovyAssignabilityCheck
            signingConfig signingConfigs.release
            setMinifyEnabled(true)
            proguardFile "proguard.txt"
            manifestPlaceholders = [providerBuildType: "release"]
        }
    }
    lint {
        disable 'InvalidPackage', 'MissingTranslation', 'ResourceType'
    }


}

