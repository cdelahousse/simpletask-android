repositories {
    google()
    mavenCentral()
    maven { url "https://jitpack.io" }
}

dependencies {
    dropboxImplementation 'com.dropbox.core:dropbox-core-sdk:8.0.2'
    dropboxImplementation 'com.dropbox.core:dropbox-android-sdk:8.0.2'
    nextcloudImplementation 'com.github.nextcloud:android-library:1.6.1'
    nextcloudImplementation 'com.google.code.gson:gson:2.9.0'
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation "androidx.legacy:legacy-support-v4:1.0.0"
    implementation 'androidx.core:core:1.7.0'
    implementation "com.google.android.material:material:1.5.0"
//    implementation "androidx.preference:preference:1.0.0"
    implementation 'androidx.appcompat:appcompat:1.4.1'
    implementation "androidx.recyclerview:recyclerview:1.2.1"
    kapt "androidx.room:room-compiler:2.4.2"
    implementation "androidx.room:room-runtime:2.4.2"

    // For Kotlin use kapt instead of annotationProcessor
    implementation 'com.atlassian.commonmark:commonmark:0.11.0'
    implementation 'com.darwinsys:hirondelle-date4j:1.5.1'
    implementation 'org.luaj:luaj-jse:3.0.1'
    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'org.hamcrest:hamcrest-library:1.3'
    androidTestImplementation('androidx.test:runner:1.3.0') {
        // Necessary if your app targets Marshmallow (since the test runner
        // hasn't moved to Marshmallow yet)
        exclude group: 'com.android.support', module: 'support-annotations'
    }
    debugImplementation 'com.squareup.leakcanary:leakcanary-android:2.8.1'
    def withoutJUnit = { exclude group: 'junit', module: 'junit' }
    // dokuwikiImplementation 'org.apache.xmlrpc:xmlrpc-client:3.1.3', withoutJUnit
    webdavImplementation 'com.squareup.okhttp3:okhttp:4.10.0-RC1'
    webdavImplementation 'com.github.thegrizzlylabs:sardine-android:v0.8'

//    webdavImplementation ('org.simpleframework:simple-xml:2.7.1')  {
//        exclude module: 'stax'
//        exclude module: 'stax-api'
//        exclude module: 'xpp3'
//    }
}

// Release signing. Values come from Gradle properties, local.properties or environment
// variables (CI); nothing is committed. Without them release builds are left unsigned.
//   signing.storeFile / SIGNING_STORE_FILE        path to the .jks keystore
//   signing.storePassword / SIGNING_STORE_PASSWORD
//   signing.keyAlias / SIGNING_KEY_ALIAS
//   signing.keyPassword / SIGNING_KEY_PASSWORD
def signingValue = { String prop, String env ->
    project.findProperty(prop) ?: localProps.getProperty(prop) ?: System.getenv(env)
}
def signingStoreFile = signingValue("signing.storeFile", "SIGNING_STORE_FILE")
if (signingStoreFile) {
    android.signingConfigs.release.storeFile = file(signingStoreFile)
    android.signingConfigs.release.storePassword = signingValue("signing.storePassword", "SIGNING_STORE_PASSWORD")
    android.signingConfigs.release.keyAlias = signingValue("signing.keyAlias", "SIGNING_KEY_ALIAS")
    android.signingConfigs.release.keyPassword = signingValue("signing.keyPassword", "SIGNING_KEY_PASSWORD")
} else {
    android.buildTypes.release.signingConfig = null
}


allprojects {
    gradle.projectsEvaluated {
        tasks.withType(JavaCompile) {
            options.compilerArgs << "-Xlint:unchecked" << "-Xlint:deprecation"
        }
    }
}
